<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Conferência de imagens — Monte Cristo</title>
<style>
    :root {
        --tinta: #0F172A;
        --tinta-fraca: #64748B;
        --linha: #E2E8F0;
        --fundo: #F8FAFC;
        --papel: #FFFFFF;
        --ok: #15803D;
        --ok-fraco: #DCFCE7;
        --nao: #B91C1C;
        --nao-fraco: #FEE2E2;
        --alerta: #B45309;
        --alerta-fraco: #FEF3C7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--tinta);
        background: var(--fundo);
        padding-bottom: 80px;
    }

    header {
        position: sticky; top: 0; z-index: 10;
        background: var(--papel);
        border-bottom: 1px solid var(--linha);
        padding: 14px 20px;
    }
    .topo { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    h1 { font-size: 17px; font-weight: 650; }
    .sub { color: var(--tinta-fraca); font-size: 13px; }

    .barra-progresso {
        height: 4px; background: var(--linha); border-radius: 2px;
        margin: 12px 0 10px; overflow: hidden; display: flex;
    }
    .barra-progresso i { display: block; height: 100%; }
    .barra-progresso .p-ok { background: var(--ok); }
    .barra-progresso .p-nao { background: var(--nao); }

    .controles { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filtro {
        border: 1px solid var(--linha); background: var(--papel);
        border-radius: 999px; padding: 5px 13px; font-size: 13px;
        cursor: pointer; color: var(--tinta-fraca); font-family: inherit;
    }
    .filtro:hover { border-color: var(--tinta-fraca); }
    .filtro.ativo { background: var(--tinta); color: #fff; border-color: var(--tinta); }
    .espaco { flex: 1; }
    .acao {
        border: 1px solid var(--tinta); background: var(--tinta); color: #fff;
        border-radius: 6px; padding: 7px 15px; font-size: 13px; font-weight: 600;
        cursor: pointer; font-family: inherit;
    }
    .acao.secundaria { background: var(--papel); color: var(--tinta); }
    .acao:disabled { opacity: .4; cursor: not-allowed; }

    .grade {
        display: grid; gap: 16px; padding: 20px;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    }

    .card {
        background: var(--papel); border: 1px solid var(--linha);
        border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
    }
    .card.decidido-ok { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
    .card.decidido-nao { border-color: var(--nao); box-shadow: 0 0 0 1px var(--nao); opacity: .75; }
    .card.focado { outline: 3px solid #2563EB; outline-offset: 2px; }

    .moldura {
        position: relative; height: 210px; background: #fff;
        display: flex; align-items: center; justify-content: center;
        /* xadrez: revela fundo branco fingindo de transparente */
        background-image:
            linear-gradient(45deg, #F1F5F9 25%, transparent 25%),
            linear-gradient(-45deg, #F1F5F9 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #F1F5F9 75%),
            linear-gradient(-45deg, transparent 75%, #F1F5F9 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        cursor: zoom-in;
    }
    .moldura img { max-width: 92%; max-height: 195px; object-fit: contain; }
    .vazio { color: var(--tinta-fraca); font-size: 13px; text-align: center; padding: 20px; cursor: default; }

    .etiqueta {
        position: absolute; top: 8px; left: 8px;
        font-size: 10px; font-weight: 700; letter-spacing: .04em;
        padding: 3px 7px; border-radius: 4px; text-transform: uppercase;
    }
    .etiqueta.critica { background: var(--alerta-fraco); color: var(--alerta); }
    .selo {
        position: absolute; top: 8px; right: 8px;
        font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px;
    }
    .selo.s-ok { background: var(--ok-fraco); color: var(--ok); }
    .selo.s-nao { background: var(--nao-fraco); color: var(--nao); }

    .corpo { padding: 11px 12px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .nome { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
    .meta { font-size: 12px; color: var(--tinta-fraca); }
    .sku { font-size: 10.5px; color: #94A3B8; font-family: ui-monospace, monospace; }
    .cuidado {
        font-size: 11.5px; background: var(--alerta-fraco); color: var(--alerta);
        padding: 6px 8px; border-radius: 5px; line-height: 1.35;
    }
    .origem { font-size: 11px; }
    .origem a { color: #2563EB; text-decoration: none; }
    .origem a:hover { text-decoration: underline; }

    .botoes { display: flex; gap: 6px; padding: 0 12px 12px; }
    .botoes button {
        flex: 1; border: 1px solid var(--linha); background: var(--papel);
        border-radius: 6px; padding: 7px; font-size: 12.5px; font-weight: 600;
        cursor: pointer; font-family: inherit; color: var(--tinta-fraca);
    }
    .botoes .b-ok:hover, .botoes .b-ok.ativo { background: var(--ok); border-color: var(--ok); color: #fff; }
    .botoes .b-nao:hover, .botoes .b-nao.ativo { background: var(--nao); border-color: var(--nao); color: #fff; }

    .nota {
        width: 100%; border: 1px solid var(--linha); border-radius: 6px;
        padding: 6px 8px; font: inherit; font-size: 12px; resize: vertical;
        margin: 0 12px 12px; width: calc(100% - 24px); min-height: 34px;
    }

    .rodape {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: var(--papel); border-top: 1px solid var(--linha);
        padding: 10px 20px; display: flex; align-items: center; gap: 14px;
        font-size: 13px; color: var(--tinta-fraca);
    }
    kbd {
        background: var(--fundo); border: 1px solid var(--linha); border-bottom-width: 2px;
        border-radius: 4px; padding: 1px 5px; font-size: 11px; font-family: ui-monospace, monospace;
    }

    .lupa {
        position: fixed; inset: 0; background: rgba(15,23,42,.9); z-index: 50;
        display: none; align-items: center; justify-content: center; cursor: zoom-out;
        padding: 40px;
    }
    .lupa.aberta { display: flex; }
    .lupa img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 8px; }

    .aviso {
        margin: 20px; padding: 16px 18px; border-radius: 10px;
        background: var(--alerta-fraco); color: var(--alerta); font-size: 13.5px; line-height: 1.55;
    }
</style>
</head>
<body>

<header>
    <div class="topo">
        <h1>Conferência de imagens</h1>
        <span class="sub" id="resumo">carregando…</span>
    </div>
    <div class="barra-progresso">
        <i class="p-ok" id="barra-ok" style="width:0"></i>
        <i class="p-nao" id="barra-nao" style="width:0"></i>
    </div>
    <div class="controles">
        <button class="filtro ativo" data-filtro="todos">Todos</button>
        <button class="filtro" data-filtro="com-foto">Com foto</button>
        <button class="filtro" data-filtro="sem-foto">Sem foto</button>
        <button class="filtro" data-filtro="criticos">Variante crítica</button>
        <button class="filtro" data-filtro="pendentes">Falta decidir</button>
        <button class="filtro" data-filtro="reprovados">Reprovados</button>
        <span class="espaco"></span>
        <button class="acao secundaria" id="btn-limpar">Limpar decisões</button>
        <button class="acao" id="btn-exportar">Baixar conferência</button>
    </div>
</header>

<div id="conteudo"></div>

<div class="rodape">
    <span><kbd>A</kbd> aprova &nbsp; <kbd>R</kbd> reprova &nbsp; <kbd>←</kbd><kbd>→</kbd> navega &nbsp; <kbd>Z</kbd> amplia</span>
    <span class="espaco"></span>
    <span id="rodape-status"></span>
</div>

<div class="lupa" id="lupa"><img id="lupa-img" alt=""></div>

<script src="dados/catalogo.js"></script>
<script src="images.js"></script>
<script>
/* ==========================================================================
   Conferência visual do banco de imagens.

   Abre com dois cliques, sem servidor. Lê o catálogo e o mapa de imagens,
   mostra cada rótulo lado a lado com o nome e a armadilha conhecida daquele
   item, e registra aprovado / reprovado. As decisões ficam no localStorage
   enquanto você trabalha e saem em conferencia.json no final.

   O reprovado não é apagado aqui: o script scripts/aplicar-conferencia.cjs
   é que tira a imagem do ar e devolve o item para nova pesquisa.
   ========================================================================== */

const CHAVE = 'monte-cristo-conferencia-v1';
const catalogo = (window.CATALOGO && window.CATALOGO.produtos) || [];
const banco = window.PRODUCT_IMAGES || {};

let decisoes = {};
try { decisoes = JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch (e) { decisoes = {}; }

let filtro = 'todos';
let focado = 0;

function fotoDe(p) {
    return banco[p.id] || (p.imagem && p.imagem.url_origem) || null;
}

function visiveis() {
    return catalogo.filter(p => {
        const d = decisoes[p.id];
        const tem = !!fotoDe(p);
        if (filtro === 'com-foto') return tem;
        if (filtro === 'sem-foto') return !tem;
        if (filtro === 'criticos') return p.flags.variante_critica;
        if (filtro === 'pendentes') return tem && (!d || !d.decisao);
        if (filtro === 'reprovados') return d && d.decisao === 'reprovado';
        return true;
    });
}

function salvar() {
    localStorage.setItem(CHAVE, JSON.stringify(decisoes));
    pintarResumo();
}

function decidir(id, decisao) {
    const atual = decisoes[id] || {};
    // clicar de novo no mesmo botão desfaz a decisão
    atual.decisao = atual.decisao === decisao ? null : decisao;
    atual.em = new Date().toISOString();
    decisoes[id] = atual;
    salvar();
    desenhar();
}

function anotar(id, texto) {
    const atual = decisoes[id] || {};
    atual.nota = texto;
    decisoes[id] = atual;
    salvar();
}

function pintarResumo() {
    const comFoto = catalogo.filter(p => fotoDe(p)).length;
    const aprovados = catalogo.filter(p => (decisoes[p.id] || {}).decisao === 'aprovado').length;
    const reprovados = catalogo.filter(p => (decisoes[p.id] || {}).decisao === 'reprovado').length;
    const faltam = comFoto - aprovados - reprovados;

    document.getElementById('resumo').textContent =
        `${comFoto} de ${catalogo.length} rótulos com foto · ${aprovados} aprovados · ` +
        `${reprovados} reprovados · ${faltam} sem decisão`;

    const total = catalogo.length || 1;
    document.getElementById('barra-ok').style.width = (aprovados / total * 100) + '%';
    document.getElementById('barra-nao').style.width = (reprovados / total * 100) + '%';

    document.getElementById('rodape-status').textContent =
        faltam === 0 && comFoto > 0 ? 'tudo conferido' : `${faltam} para conferir`;
    document.getElementById('btn-exportar').disabled = aprovados + reprovados === 0;
}

function escapar(t) {
    return String(t == null ? '' : t)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function desenhar() {
    const alvo = document.getElementById('conteudo');
    const lista = visiveis();

    if (!catalogo.length) {
        alvo.innerHTML = '<div class="aviso"><strong>Catálogo não carregou.</strong> ' +
            'Rode <code>node scripts/gerar-catalogo.cjs</code> e abra esta página de novo.</div>';
        return;
    }
    if (!Object.keys(banco).length && filtro === 'todos') {
        alvo.innerHTML = '<div class="aviso"><strong>Nenhuma imagem no banco ainda.</strong> ' +
            'A pesquisa precisa devolver <code>pesquisa-imagens/imagens.json</code> e você rodar ' +
            '<code>node scripts/baixar-imagens.cjs</code>. Esta página já funciona: quando as fotos ' +
            'chegarem, elas aparecem aqui para conferência.</div>' + montarGrade(lista);
        ligarEventos();
        return;
    }

    alvo.innerHTML = montarGrade(lista);
    ligarEventos();
}

function montarGrade(lista) {
    if (!lista.length) return '<div class="aviso">Nada neste filtro.</div>';

    return '<div class="grade">' + lista.map((p, i) => {
        const foto = fotoDe(p);
        const d = decisoes[p.id] || {};
        const classe = d.decisao === 'aprovado' ? 'decidido-ok'
            : d.decisao === 'reprovado' ? 'decidido-nao' : '';

        const moldura = foto
            ? `<div class="moldura" data-zoom="${escapar(foto)}">
                   <img src="${escapar(foto)}" alt="${escapar(p.imagem.alt)}"
                        onerror="this.parentNode.innerHTML='<span class=vazio>arquivo não abriu<br><small>${escapar(foto)}</small></span>'">
                   ${p.flags.variante_critica ? '<span class="etiqueta critica">variante crítica</span>' : ''}
                   ${d.decisao === 'aprovado' ? '<span class="selo s-ok">aprovada</span>' : ''}
                   ${d.decisao === 'reprovado' ? '<span class="selo s-nao">reprovada</span>' : ''}
               </div>`
            : `<div class="moldura"><span class="vazio">sem foto ainda<br><small>usa a garrafa vetorial</small></span>
                   ${p.flags.variante_critica ? '<span class="etiqueta critica">variante crítica</span>' : ''}
               </div>`;

        return `<div class="card ${classe} ${i === focado ? 'focado' : ''}" data-id="${p.id}" data-i="${i}">
            ${moldura}
            <div class="corpo">
                <div class="nome">${escapar(p.nome)}</div>
                <div class="meta">${escapar(p.embalagem.volume_label)} · ${escapar(p.embalagem.nome)} · ${escapar(p.categoria.nome)}</div>
                <div class="sku">${escapar(p.sku)}</div>
                ${p.busca_imagem.cuidado ? `<div class="cuidado">${escapar(p.busca_imagem.cuidado)}</div>` : ''}
                ${p.imagem.pagina_origem ? `<div class="origem"><a href="${escapar(p.imagem.pagina_origem)}" target="_blank" rel="noopener">conferir na origem</a>${p.imagem.fonte ? ' · ' + escapar(p.imagem.fonte) : ''}</div>` : ''}
            </div>
            ${foto ? `<div class="botoes">
                <button class="b-ok ${d.decisao === 'aprovado' ? 'ativo' : ''}" data-acao="aprovado">Aprovar</button>
                <button class="b-nao ${d.decisao === 'reprovado' ? 'ativo' : ''}" data-acao="reprovado">Reprovar</button>
            </div>` : ''}
            ${d.decisao === 'reprovado' ? `<textarea class="nota" placeholder="o que está errado? (vai junto no pedido de nova busca)">${escapar(d.nota || '')}</textarea>` : ''}
        </div>`;
    }).join('') + '</div>';
}

function ligarEventos() {
    document.querySelectorAll('.card').forEach(card => {
        const id = card.dataset.id;

        card.querySelectorAll('.botoes button').forEach(b => {
            b.onclick = () => { focado = Number(card.dataset.i); decidir(id, b.dataset.acao); };
        });

        const nota = card.querySelector('.nota');
        if (nota) nota.oninput = () => anotar(id, nota.value);

        const moldura = card.querySelector('.moldura[data-zoom]');
        if (moldura) moldura.onclick = () => ampliar(moldura.dataset.zoom);
    });
    pintarResumo();
}

function ampliar(src) {
    document.getElementById('lupa-img').src = src;
    document.getElementById('lupa').classList.add('aberta');
}

document.getElementById('lupa').onclick = function () { this.classList.remove('aberta'); };

document.querySelectorAll('.filtro').forEach(b => {
    b.onclick = () => {
        document.querySelectorAll('.filtro').forEach(x => x.classList.remove('ativo'));
        b.classList.add('ativo');
        filtro = b.dataset.filtro;
        focado = 0;
        desenhar();
    };
});

document.getElementById('btn-limpar').onclick = () => {
    if (!confirm('Apagar todas as decisões desta conferência?')) return;
    decisoes = {};
    localStorage.removeItem(CHAVE);
    desenhar();
};

document.getElementById('btn-exportar').onclick = () => {
    const saida = {
        conferido_em: new Date().toISOString(),
        total_catalogo: catalogo.length,
        itens: catalogo
            .filter(p => (decisoes[p.id] || {}).decisao)
            .map(p => ({
                id: p.id,
                sku: p.sku,
                nome: p.nome,
                decisao: decisoes[p.id].decisao,
                nota: decisoes[p.id].nota || '',
                arquivo: fotoDe(p),
                decidido_em: decisoes[p.id].em
            }))
    };
    const blob = new Blob([JSON.stringify(saida, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'conferencia.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

/* Teclado: é o que faz 80 itens caberem em dez minutos. */
document.onkeydown = e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

    const lista = visiveis();
    if (!lista.length) return;
    const atual = lista[focado];

    if (e.key === 'Escape') { document.getElementById('lupa').classList.remove('aberta'); return; }
    if (e.key === 'ArrowRight') { focado = Math.min(focado + 1, lista.length - 1); desenhar(); rolar(); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { focado = Math.max(focado - 1, 0); desenhar(); rolar(); e.preventDefault(); }
    if (!atual) return;
    if (e.key.toLowerCase() === 'a' && fotoDe(atual)) { decidir(atual.id, 'aprovado'); avancar(); }
    if (e.key.toLowerCase() === 'r' && fotoDe(atual)) { decidir(atual.id, 'reprovado'); }
    if (e.key.toLowerCase() === 'z' && fotoDe(atual)) { ampliar(fotoDe(atual)); }
};

function avancar() {
    const lista = visiveis();
    focado = Math.min(focado + 1, Math.max(lista.length - 1, 0));
    desenhar();
    rolar();
}

function rolar() {
    const el = document.querySelector('.card.focado');
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

desenhar();
</script>
</body>
</html>
