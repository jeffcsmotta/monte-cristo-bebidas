<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
    <defs>
        <linearGradient id="mcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34D399" />
            <stop offset="40%" stop-color="#1B7588" />
            <stop offset="100%" stop-color="#0E4663" />
        </linearGradient>
    </defs>
    <!-- Emblem -->
    <g transform="translate(250, 45) scale(0.9)">
        <!-- Outer Circle Arc -->
        <path d="M -32,-8 A 38,38 0 1,0 32,8" fill="none" stroke="url(#mcGrad)" stroke-width="8.5" stroke-linecap="round" />
        <!-- Top Arc -->
        <path d="M -22,-26 A 38,38 0 0,1 22,-26" fill="none" stroke="url(#mcGrad)" stroke-width="8.5" stroke-linecap="round" />
        <!-- M/C Monogram Lines -->
        <path d="M -26,-22 L 0,8 L 26,-22" fill="none" stroke="url(#mcGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 0,8 L 26,34" fill="none" stroke="url(#mcGrad)" stroke-width="8" stroke-linecap="round" />
    </g>
    <!-- Brand Typography -->
    <text x="250" y="125" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#0E4663" text-anchor="middle" letter-spacing="2.5">MONTE CRISTO</text>
    <text x="250" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#1B7588" text-anchor="middle" letter-spacing="1.2">Distribuidora de Bebidas</text>
</svg>
