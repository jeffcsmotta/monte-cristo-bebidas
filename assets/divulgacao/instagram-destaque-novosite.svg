<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1B7588" />
      <stop offset="50%" stop-color="#0E4663" />
      <stop offset="100%" stop-color="#072231" />
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="#072231"/>
  
  <!-- Outer Ring (Instagram Safe Area) -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="url(#goldRing)" stroke-width="6"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="250" cy="230" r="140" fill="#1B7588" opacity="0.3" filter="url(#glow)"/>

  <!-- Globe & Network Icon (Minimalist Tech & Presence) -->
  <g transform="translate(150, 130) scale(10)" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Globe outline -->
    <circle cx="10" cy="10" r="9"/>
    <!-- Longitude arcs -->
    <path d="M10 1a14.5 14.5 0 0 0 0 18"/>
    <path d="M10 1a14.5 14.5 0 0 1 0 18"/>
    <!-- Latitude line -->
    <line x1="1" y1="10" x2="19" y2="10"/>
  </g>

  <!-- Clean Label Text -->
  <text x="250" y="380" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">NOVO SITE</text>
  <text x="250" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#34D399" text-anchor="middle" letter-spacing="2">MONTE CRISTO</text>
</svg>
