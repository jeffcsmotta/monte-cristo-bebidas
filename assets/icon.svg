<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="mcIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34D399" />
            <stop offset="40%" stop-color="#1B7588" />
            <stop offset="100%" stop-color="#0E4663" />
        </linearGradient>
    </defs>
    <rect width="512" height="512" fill="#FFFFFF" />
    <g transform="translate(256,256) scale(5.2)">
        <!-- Outer Circle Arc (mirrors assets/logo.svg emblem) -->
        <path d="M -32,-8 A 38,38 0 1,0 32,8" fill="none" stroke="url(#mcIconGrad)" stroke-width="8.5" stroke-linecap="round" />
        <!-- Top Arc -->
        <path d="M -22,-26 A 38,38 0 0,1 22,-26" fill="none" stroke="url(#mcIconGrad)" stroke-width="8.5" stroke-linecap="round" />
        <!-- M/C Monogram Lines -->
        <path d="M -26,-22 L 0,8 L 26,-22" fill="none" stroke="url(#mcIconGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 0,8 L 26,34" fill="none" stroke="url(#mcIconGrad)" stroke-width="8" stroke-linecap="round" />
    </g>
</svg>
